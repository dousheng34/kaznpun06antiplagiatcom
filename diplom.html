<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мамиров Диас — Диплом жұмысы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      font-family: 'Inter', sans-serif;
      color: #e0e0ff;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 100%);
      border-bottom: 3px solid #6c63ff;
      padding: 20px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(108,99,255,0.3);
    }
    .header h1 {
      font-size: clamp(14px, 3.5vw, 22px);
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .header p {
      font-size: clamp(11px, 2.5vw, 14px);
      color: #a0a0cc;
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      background: #6c63ff;
      color: #fff;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
      font-weight: 600;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: #13132a;
      border-bottom: 1px solid #2a2a4a;
      flex-wrap: wrap;
    }
    .controls button {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-width: 44px;
      min-height: 44px;
    }
    .controls button:hover { background: #574fd6; }
    .controls button:active { transform: scale(0.96); }
    .controls button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .page-info {
      font-size: 14px;
      color: #a0a0cc;
      white-space: nowrap;
      min-width: 80px;
      text-align: center;
    }
    .zoom-controls {
      display: flex;
      gap: 8px;
    }
    .zoom-controls button {
      padding: 8px 14px;
    }

    /* ── Canvas area ── */
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 40px;
      gap: 20px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 860px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 40px rgba(108,99,255,0.2);
    }
    .page-wrapper canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }
    .page-num-label {
      background: #1a1a3e;
      color: #7070aa;
      text-align: center;
      font-size: 12px;
      padding: 6px;
      font-family: 'Inter', sans-serif;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #6c63ff33;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #a0a0cc; font-size: 15px; }

    /* ── Error ── */
    #error-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #ff6b6b;
      font-size: 15px;
    }

    /* ── Scroll to top ── */
    #scroll-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(108,99,255,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: background 0.2s;
    }
    #scroll-top:hover { background: #574fd6; }
    #scroll-top.show { display: flex; }

    /* ── Mobile tweaks ── */
    @media (max-width: 500px) {
      .controls { padding: 10px; gap: 8px; }
      .controls button { padding: 8px 12px; font-size: 13px; }
      #pdf-container { padding: 12px 6px 40px; gap: 14px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📖 Мамиров Диас Нургисаевич</h1>
  <p>Дипломдық жұмыс — Толық мәтін</p>
  <span class="badge">КазНПУ · 2024</span>
</div>

<div class="controls">
  <button id="btn-prev" disabled>◀ Алдыңғы</button>
  <span class="page-info" id="page-info">— / —</span>
  <button id="btn-next" disabled>Келесі ▶</button>
  <div class="zoom-controls">
    <button id="btn-zoom-out" title="Кішірейту">−</button>
    <button id="btn-zoom-in" title="Үлкейту">+</button>
  </div>
</div>

<div id="pdf-container">
  <div id="loading">
    <div class="spinner"></div>
    <p>PDF жүктелуде, күте тұрыңыз...</p>
  </div>
  <div id="error-msg">
    ❌ PDF жүктеу қатесі. Интернет байланысын тексеріңіз.
  </div>
</div>

<button id="scroll-top" title="Жоғарыға">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = 'https://raw.githubusercontent.com/dousheng34/magic-report/main/%D0%9C%D0%90%D0%9C%D0%98%D0%A0%D0%9E%D0%92%20%D0%94%D0%98%D0%90%D0%A1%20%D0%9D%D0%A3%D0%A0%D0%93%D0%98%D0%A1%D0%90%D0%95%D0%92%D0%98%D0%A7%20%D0%A4%D0%98%D0%9D%D0%90%D0%9B1%20(%D0%BA%D0%BE%D0%BF%D0%B8%D1%8F).pdf';

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pdfDoc = null;
  var currentPage = 1;
  var totalPages = 0;
  var scale = window.innerWidth < 600 ? 1.2 : 1.8;
  var renderQueue = [];

  var container = document.getElementById('pdf-container');
  var loading = document.getElementById('loading');
  var errorMsg = document.getElementById('error-msg');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var pageInfo = document.getElementById('page-info');
  var scrollTopBtn = document.getElementById('scroll-top');

  // Scroll to top button
  window.addEventListener('scroll', function () {
    scrollTopBtn.classList.toggle('show', window.scrollY > 400);
  });
  scrollTopBtn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Zoom
  document.getElementById('btn-zoom-in').addEventListener('click', function () {
    scale = Math.min(scale + 0.3, 3.5);
    rerenderAll();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', function () {
    scale = Math.max(scale - 0.3, 0.6);
    rerenderAll();
  });

  function updateControls() {
    btnPrev.disabled = currentPage <= 1;
    btnNext.disabled = currentPage >= totalPages;
    pageInfo.textContent = currentPage + ' / ' + totalPages;
  }

  function scrollToPage(num) {
    var el = document.getElementById('page-' + num);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  btnPrev.addEventListener('click', function () {
    if (currentPage > 1) { currentPage--; updateControls(); scrollToPage(currentPage); }
  });
  btnNext.addEventListener('click', function () {
    if (currentPage < totalPages) { currentPage++; updateControls(); scrollToPage(currentPage); }
  });

  // Intersection observer for current page tracking
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var num = parseInt(entry.target.id.replace('page-', ''));
        if (!isNaN(num)) { currentPage = num; updateControls(); }
      }
    });
  }, { threshold: 0.3 });

  function renderPage(num) {
    return pdfDoc.getPage(num).then(function (page) {
      var viewport = page.getViewport({ scale: scale });
      var wrapper = document.getElementById('page-' + num);
      var canvas = wrapper ? wrapper.querySelector('canvas') : null;
      if (!canvas) return;
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
    });
  }

  function buildLayout(numPages) {
    loading.style.display = 'none';
    container.innerHTML = '';

    for (var i = 1; i <= numPages; i++) {
      var wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      wrapper.id = 'page-' + i;

      var canvas = document.createElement('canvas');
      var label = document.createElement('div');
      label.className = 'page-num-label';
      label.textContent = i + '-бет / ' + numPages;

      wrapper.appendChild(canvas);
      wrapper.appendChild(label);
      container.appendChild(wrapper);
      observer.observe(wrapper);
    }

    // Render pages sequentially
    var chain = Promise.resolve();
    for (var j = 1; j <= numPages; j++) {
      (function (n) {
        chain = chain.then(function () { return renderPage(n); });
      })(j);
    }
  }

  function rerenderAll() {
    if (!pdfDoc) return;
    var chain = Promise.resolve();
    for (var i = 1; i <= totalPages; i++) {
      (function (n) {
        chain = chain.then(function () { return renderPage(n); });
      })(i);
    }
  }

  // Load PDF
  pdfjsLib.getDocument({ url: PDF_URL }).promise
    .then(function (pdf) {
      pdfDoc = pdf;
      totalPages = pdf.numPages;
      updateControls();
      buildLayout(totalPages);
      btnPrev.disabled = true;
      btnNext.disabled = totalPages <= 1;
    })
    .catch(function (err) {
      loading.style.display = 'none';
      errorMsg.style.display = 'block';
      errorMsg.innerHTML = '❌ PDF жүктеу қатесі: ' + err.message;
      console.error(err);
    });
})();
</script>
</body>
</html>
